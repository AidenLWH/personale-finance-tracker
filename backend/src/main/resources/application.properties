# Application
spring.application.name=finance-tracker

# Database - reads from environment variables in production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/financetracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:financeuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:financepass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server
server.port=${PORT:8080}

# JWT - reads from environment variables in production
jwt.secret=${JWT_SECRET:3f8a2b1c9d4e7f6a0b5c8d2e1f4a7b3c9d6e2f5a8b1c4d7e0f3a6b9c2d5e8f1a}
jwt.expiration=${JWT_EXPIRATION:86400000}